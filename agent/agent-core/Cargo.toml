[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
description = "Shared protocol, aggregation, buffering and pinned-TLS client for pmacct-analyzer endpoint agents"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
hex = "0.4"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
x509-parser = "0.16"
